---
name: Commit Lint

# Thin caller for the organization policy suite: Conventional Commit messages
# and PR title (decisions/0003), banned bot/AI-agent Co-authored-by trailers
# (AGENTS.md), branch-name shape (decisions/0019), and issue traceability on
# the pull request (decisions/0022). Runs on `edited` too, so fixing a title
# or adding the issue link re-evaluates without a push.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

# No concurrency block here: these are required checks that push and pull
# request events can produce for the same head, and a cancelled or superseded
# run would leave a stale result (see the organization workflow contract).

jobs:
  policy:
    name: Policy
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/commit-lint.yml@main
